<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f0" />
    <style>
      html {
        background: #f5f5f0;
        color: #242521;
      }
      html[data-theme='dark'] {
        background: #171917;
        color: #f0efe8;
      }
    </style>
    <script>
      // Apply before styles or React render; storage may be blocked in private browsers.
      ;(() => {
        let mode = 'system'
        try {
          const saved = localStorage.getItem('portfolio-theme')
          if (saved === 'light' || saved === 'dark') mode = saved
        } catch {}
        const theme =
          mode === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : mode
        document.documentElement.dataset.themeMode = mode
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#171917' : '#f5f5f0'
      })()
    </script>
    <meta
      name="description"
      content="Carl John Haro — Full-Stack & AI Developer. Explore AI-powered applications, interactive experiences, and the systems behind them."
    />
    <meta property="og:title" content="Carl John Haro — Built to interact." />
    <meta
      property="og:description"
      content="A hands-on portfolio of AI applications, full-stack systems, and interactive experiences."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link
      rel="preload"
      href="./fonts/Satoshi-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/GeistMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Carl John Haro — Full-Stack & AI Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
